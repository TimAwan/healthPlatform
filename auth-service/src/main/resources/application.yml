server:
  port: 9101

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:nacos:${spring.application.name}.yml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

health:
  jwt:
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:7200}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}

management:
  endpoints:
    web:
      exposure:
        include: health
