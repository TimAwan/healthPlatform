server:
  port: 9000

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: system-route
          uri: lb://system-service
          predicates:
            - Path=/api/v1/system/**

gateway:
  security:
    whitelist:
      - /api/v1/auth/login
      - /api/v1/auth/captcha
      - /api/v1/auth/refresh
      - /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health
